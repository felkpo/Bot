name: Node.js CI - Royal Prussian

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x' # Baseado no DEPLOYMENT.md
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Validate configuration from example
      run: cp .env.example .env && node -e "require('./src/config/validator.js').runValidation()"