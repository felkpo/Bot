name: Node.js CI - Royal Prussian

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x' # Baseado no DEPLOYMENT.md
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Validate application startup (Smoke Test)
      run: |
        cp .env.example .env
        # Executa o bot e espera que ele atinja o tempo limite.
        # Se ele travar antes do tempo limite, a CI falhará, capturando erros de inicialização.
        # Um tempo limite (código de saída 124) é tratado como uma inicialização bem-sucedida.
        timeout 15s node index.js || ( \
          exit_code=$? ; \
          if [ $exit_code -eq 124 ]; then \
            echo "Inicialização bem-sucedida (atingiu o tempo limite como esperado)." ; \
            exit 0 ; \
          else \
            echo "A inicialização falhou com o código de saída $exit_code." ; \
            exit $exit_code ; \
          fi \
        )